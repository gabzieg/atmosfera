name: Build APK (Atmosfera)

# Compila o APK de debug na nuvem a cada push na main (ou manualmente).
# Não precisa de Android Studio nem PC potente: o GitHub faz o build e
# disponibiliza o APK pra baixar e instalar no celular.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Compilar APK de debug
        working-directory: android-app
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Publicar o APK como artefato
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atmosfera-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
