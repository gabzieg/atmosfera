# Dependabot — grátis mesmo em repo privado (ao contrário do CodeQL, que
# exige GitHub Advanced Security/plano pago pra repo privado — verificado
# 2026-07-29, por isso não tem workflow de CodeQL neste repo).
#
# Abre PR sozinho quando uma dependência tem update — o PR passa pelo mesmo
# gate normal (testDebugUnitTest + lintDebug + assembleDebug + secret-scan)
# antes de poder mergear. NÃO mergear automático, e revisar o PR agrupado item
# a item: gate verde não prova que o app funciona (ver o `ignore` abaixo e
# docs/dev/DECISAO-AGP-9-MIGRACAO.md — build verde, app crashando em runtime).

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/android-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      gradle-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
    # Cada item abaixo quebrou (ou exige migração deliberada) em 2026-09 — não é
    # precaução genérica. Sem isto, o PR agrupado semanal volta a trazer tudo de
    # uma vez, como o #30 (fechado em 2026-09-29: CI vermelha + AGP 9 revertido).
    # Subir qualquer um destes é trabalho próprio, numa branch, testado em
    # release no device — não um bump automático.
    ignore:
      # AGP 9: testado e revertido em 2026-09-18 — passou no gate e o app
      # crashava na abertura; o Kotlin embutido do AGP 9 ainda rebaixa a versão
      # do Kotlin em silêncio. Ver docs/dev/DECISAO-AGP-9-MIGRACAO.md.
      - dependency-name: "com.android.application*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      # Gradle 9 só faz sentido junto com o AGP 9 (acima).
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      # Retrofit 3 / OkHttp 5: majors com quebra de API. Retrofit está em
      # 2.12.0 de propósito — foi o fix do crash de clima no release
      # (ParameterizedType sob R8), commit 5da7ead.
      - dependency-name: "com.squareup.retrofit2:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.squareup.okhttp3:*"
        update-types: ["version-update:semver-major"]
      # lifecycle 2.11+ exige compileSdk 37, acima do teto do AGP 8.13 (ver
      # a nota em gradle/libs.versions.toml). Faixa em sintaxe Maven.
      - dependency-name: "androidx.lifecycle:*"
        versions: ["[2.11,)"]
      # Mesmo teto (compileSdk 37 + AGP 9.1), visto no PR #35 em 2026-09-30:
      # compose-bom 2026.09.00 (Compose 1.12), core 1.19.1 e navigation 2.10.2
      # quebram o checkDebugAarMetadata. Travado em minor/major até a migração
      # para AGP 9; patches seguem liberados.
      - dependency-name: "androidx.compose:compose-bom"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "androidx.core:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "androidx.navigation:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Kotlin (plugins kotlin.android e plugin.compose): minor novo exige R8
      # mais novo que o do AGP 8.13 — o 2.4 já precisa de R8 9.1.29. Patch
      # (2.4.x) segue liberado. O padrão tem ponto de propósito: sem ele,
      # "org.jetbrains.kotlin*" também pegaria org.jetbrains.kotlinx (coroutines).
      - dependency-name: "org.jetbrains.kotlin.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
