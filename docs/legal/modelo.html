<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<style>
  :root{
    --bg:#ffffff; --fg:#111111; --muted:#5c5c5c; --rule:#e2e2e2;
    --surface:#f6f6f6; --mark-bg:#ffe9a8; --mark-fg:#3d2f00;
    --measure:44rem;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d0d0d; --fg:#f2f2f2; --muted:#a1a1a1; --rule:#2a2a2a;
      --surface:#171717; --mark-bg:#4a3a00; --mark-fg:#ffe9a8;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d0d0d; --fg:#f2f2f2; --muted:#a1a1a1; --rule:#2a2a2a;
    --surface:#171717; --mark-bg:#4a3a00; --mark-fg:#ffe9a8;
  }
  :root[data-theme="light"]{
    --bg:#ffffff; --fg:#111111; --muted:#5c5c5c; --rule:#e2e2e2;
    --surface:#f6f6f6; --mark-bg:#ffe9a8; --mark-fg:#3d2f00;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:400 17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:clamp(1.5rem,5vw,4rem) clamp(1.1rem,5vw,2rem);
  }
  main{max-width:var(--measure); margin:0 auto}
  header{border-bottom:1px solid var(--rule); padding-bottom:1.6rem; margin-bottom:2.4rem}
  .kicker{
    font-size:.75rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); margin:0 0 .6rem;
  }
  h1{font-size:clamp(1.7rem,5.5vw,2.4rem); line-height:1.2; margin:0 0 1rem; font-weight:650}
  h2{
    font-size:clamp(1.15rem,3.4vw,1.35rem); font-weight:650; line-height:1.3;
    margin:3rem 0 .8rem; padding-top:1.4rem; border-top:1px solid var(--rule);
  }
  h3{font-size:1.02rem; font-weight:650; margin:2rem 0 .5rem}
  p,ul,ol{margin:0 0 1rem}
  ul,ol{padding-left:1.4rem}
  li{margin:.35rem 0}
  li>ul{margin:.35rem 0 .35rem}
  a{color:inherit; text-underline-offset:.18em; text-decoration-thickness:1px}
  a:hover{text-decoration-thickness:2px}
  code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.88em; background:var(--surface); padding:.1em .35em; border-radius:4px;
  }
  strong{font-weight:650}
  .meta{
    list-style:none; padding:0; margin:0; color:var(--muted); font-size:.9rem;
  }
  .meta li{margin:.15rem 0}
  .summary{
    background:var(--surface); border:1px solid var(--rule); border-radius:12px;
    padding:1.25rem 1.4rem; margin:0 0 1rem;
  }
  .summary h2{margin:0 0 .6rem; padding:0; border:0; font-size:1.1rem}
  .summary p:last-child,.summary ul:last-child{margin-bottom:0}
  .note{color:var(--muted); font-size:.92rem}
  .fill{
    background:var(--mark-bg); color:var(--mark-fg); padding:.05em .3em;
    border-radius:3px; font-weight:650;
  }
  .table-wrap{overflow-x:auto; margin:0 0 1.2rem; border:1px solid var(--rule); border-radius:12px}
  table{border-collapse:collapse; width:100%; min-width:30rem; font-size:.94rem}
  th,td{text-align:left; vertical-align:top; padding:.7rem .9rem; border-bottom:1px solid var(--rule)}
  thead th{background:var(--surface); font-weight:650; white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  table.kv th{width:38%; font-weight:650; background:transparent; white-space:normal}
  /* Em tela estreita (celular, e a WebView do app é sempre estreita) a tabela
     chave/valor vira blocos empilhados: com min-width:30rem ela era cortada
     na horizontal e o valor ficava ilegível. */
  @media (max-width:34rem){
    table.kv{min-width:0}
    table.kv th,table.kv td{display:block; width:auto}
    table.kv th{padding-bottom:.15rem; border-bottom:0}
    table.kv td{padding-top:0}
  }
  footer{
    margin-top:3.5rem; padding-top:1.4rem; border-top:1px solid var(--rule);
    color:var(--muted); font-size:.9rem;
  }
</style>
</head>
<body>
<main>
{{body}}
</main>
</body>
</html>
