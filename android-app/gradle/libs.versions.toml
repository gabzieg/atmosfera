# Catálogo de versões — fonte única das versões de biblioteca do projeto.
# Gradle detecta este arquivo sozinho (gradle/libs.versions.toml ao lado do
# settings.gradle) e expõe o acessor `libs.*` nos build.gradle.
#
# O antigo teto "Kotlin 1.9.23 / Billing 6.2.1" foi REMOVIDO em 2026-08-08: o
# Google exige Billing v8+ para app novo ou update a partir de 31/ago/2026, e
# 6.x já estava fora do prazo desde 2025. Migrado para Kotlin 2.x + Billing 9.x
# de uma vez, já que a incompatibilidade era exatamente a metadata Kotlin 2.x.
#
# ⚠️ Prazos do Google que amarram estas versões (não são preferência nossa):
#   billing 9.1.0  ─ v8+ obrigatório em 31/ago/2026; v9 vale até 31/ago/2028.
#   targetSdk 36   ─ app novo precisa targetar API 36+ a partir de 31/ago/2026.
#                    Fica em app/build.gradle, não aqui, mas anda junto.

[versions]
agp = "8.13.2"
kotlin = "2.4.10"
composeBom = "2026.06.01"
coroutines = "1.7.3"
retrofit = "2.9.0"
okhttp = "4.12.0"
coreKtx = "1.13.0"                 # 1.15.0 puxa compileSdk 35 — não subir sozinho
appcompat = "1.6.1"
lifecycle = "2.10.0"               # 2.11.0 exige compileSdk 37 (acima do teto da AGP 8.13)
material = "1.11.0"
work = "2.9.0"
preference = "1.2.1"
playServicesLocation = "21.2.0"
billing = "9.1.0"                  # v8+ é exigência do Google (ver aviso acima)
activityCompose = "1.8.2"
navigationCompose = "2.7.7"
junit = "4.13.2"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
# Onde mora o LocalLifecycleOwner a partir do Compose 1.7 — o antigo, em
# androidx.compose.ui.platform, foi descontinuado.
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# A partir do Kotlin 2.0 o compilador do Compose vem dentro do próprio Kotlin:
# deixou de ser artefato à parte (`composeOptions.kotlinCompilerExtensionVersion`)
# e virou plugin, sempre na mesma versão do Kotlin. Por isso não existe mais uma
# `composeCompiler` neste catálogo pra manter em sincronia na mão.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
