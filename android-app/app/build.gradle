plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.atmosfera.wallpaper'
    compileSdk 34

    defaultConfig {
        applicationId "com.atmosfera.wallpaper"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.11'
    }

    // Comprime os assets WebP com mais agressividade no release
    aaptOptions {
        noCompress "webp"
    }
}

dependencies {
    // Kotlin
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Networking (Open-Meteo)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Android core
    implementation 'androidx.core:core-ktx:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.android.gms:play-services-location:21.2.0'

    // Google Play Billing — Premium por compra única
    // A mais recente publicada é 9.1.0, mas 7.0.0+ é compilada com um metadata
    // de Kotlin (2.x) que o compilador Kotlin 1.9.23 deste projeto não consegue
    // ler ("incompatible version of Kotlin"). 6.2.1 é o último patch da linha
    // 6.x (mesma API já usada aqui) compatível com o Kotlin atual do projeto —
    // confirmado rodando `gradlew assembleDebug` de verdade, não só a versão do
    // Maven. Para ir além, é preciso subir o plugin Kotlin do projeto também.
    implementation 'com.android.billingclient:billing-ktx:6.2.1'

    // Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.02.02')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Testes unit (JVM puro — não sobem no APK). Rodam com `gradlew testDebugUnitTest`.
    testImplementation 'junit:junit:4.13.2'
}
