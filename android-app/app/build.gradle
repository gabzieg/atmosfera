plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

// Assinatura de release: lida de android-app/keystore.properties, que NUNCA é
// commitado (coberto por .gitignore). Sem esse arquivo, o build de release
// simplesmente não assina — não afeta assembleDebug nem a CI (que só builda
// debug). Gere o arquivo real a partir de keystore.properties.example — ver
// a seção "Build de release" no README.md para o passo a passo com keytool.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def temKeystore = keystorePropertiesFile.exists()
if (temKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.atmosfera.wallpaper'
    compileSdk 36

    defaultConfig {
        applicationId "com.atmosfera.wallpaper"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        if (temKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (temKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    // Sem `composeOptions`: do Kotlin 2.0 em diante o compilador do Compose é o
    // plugin `kotlin.plugin.compose` (declarado acima), na mesma versão do Kotlin.

    // Comprime os assets WebP com mais agressividade no release
    aaptOptions {
        noCompress "webp"
    }

    lint {
        // Congela os avisos/erros pré-existentes num baseline: o CI pega
        // regressão NOVA sem quebrar pelo conhecido (init do WorkManager no
        // manifesto). Ao corrigir um deles, regenere o baseline apagando o
        // arquivo e rodando `gradlew lintDebug` de novo.
        //
        // Regenerado em 2026-08-08 pelo lint 8.13.2 (o anterior era do 8.3.0 e
        // citava linhas/versões que a migração apagou).
        //
        // **Zero erros no baseline.** O único que havia,
        // RemoveWorkManagerInitializer, era bug real — a Configuration de
        // AtmosferaApp era descartada em silêncio — e foi CORRIGIDO no
        // manifesto, não recongelado. O que resta são 54 avisos/hints:
        //   · 32 UseKtx        — sugestão de estilo; a maioria em engine/ (congelado)
        //   · 15 versão de lib — subir retrofit 3.x, okhttp 5.x etc. é decisão
        //                        própria, não arrasto desta migração
        //   ·  4 orientação    — LockedOrientationActivity + DiscouragedApi:
        //                        orientação fixa passa a ser IGNORADA no
        //                        Android 16; é decisão de produto
        //   ·  1 OldTargetApi  — pede targetSdk 37, acima do teto da AGP 8.13
        //   ·  2 Compose       — AutoboxingStateCreation + 1 hint
        //
        // Ao corrigir algum, apague o arquivo e rode `gradlew lintDebug` DUAS
        // vezes: a primeira recria o baseline e falha de propósito.
        baseline = file("lint-baseline.xml")
    }
}

// PaginasLegaisSincronizadasTest lê as páginas legais dos dois lados (docs/ e
// assets/legal/). O Gradle não descobre isso sozinho: sem declarar as entradas,
// editar um HTML deixava a task UP-TO-DATE e o teste nem rodava — falso verde
// local. Em CI (clone limpo) sempre roda, mas não dá pra depender disso.
tasks.matching { it.name.startsWith('test') && it.name.endsWith('UnitTest') }.configureEach {
    inputs.dir(rootProject.file('../docs')).withPropertyName('paginasLegaisWeb')
    inputs.dir('src/main/assets/legal').withPropertyName('paginasLegaisAsset')
}

dependencies {
    // Versões em gradle/libs.versions.toml (o teto Billing/Kotlin está lá).

    // Kotlin
    implementation libs.kotlinx.coroutines.android

    // Networking (Open-Meteo)
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.okhttp
    implementation libs.okhttp.logging

    // Android core
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.google.material
    implementation libs.androidx.work.runtime.ktx
    implementation libs.androidx.preference.ktx
    implementation libs.play.services.location

    // Google Play Billing — Premium por compra única (v8+ exigido pelo Google, ver toml)
    implementation libs.billing.ktx

    // Jetpack Compose
    def composeBom = platform(libs.compose.bom)
    implementation composeBom
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    implementation libs.androidx.activity.compose
    implementation libs.androidx.navigation.compose

    // Testes unit (JVM puro — não sobem no APK). Rodam com `gradlew testDebugUnitTest`.
    testImplementation libs.junit
}
